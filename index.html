<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳表單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #fffde7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .header { background: #ffb300; color: white; width: 100%; max-width: 480px; padding: 16px; border-radius: 12px 12px 0 0; text-align: center; font-size: 18px; font-weight: bold; }
    .tab { display: flex; width: 100%; max-width: 480px; }
    .tab button { flex: 1; padding: 12px; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
    .tab .expense { background: #ff5252; color: white; }
    .tab .income { background: #e0e0e0; color: #333; }
    .tab.income-mode .expense { background: #e0e0e0; color: #333; }
    .tab.income-mode .income { background: #69f0ae; color: #333; }
    .form { background: #fffff0; width: 100%; max-width: 480px; padding: 20px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 15px; color: #555; }
    .date-row input { border: none; border-bottom: 1px solid #ccc; background: transparent; font-size: 15px; padding: 4px; }
    label { display: block; margin-bottom: 6px; color: #888; font-size: 14px; }
    input[type=text], input[type=number] { width: 100%; border: none; border-bottom: 2px solid #eee; padding: 10px 0; font-size: 16px; background: transparent; outline: none; margin-bottom: 20px; }
    input[type=text]:focus, input[type=number]:focus { border-bottom-color: #ffb300; }
    .amount-row { display: flex; align-items: center; gap: 8px; }
    .amount-row span { font-size: 20px; color: #555; }
    .submit-btn { width: 100%; padding: 14px; background: #ffb300; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    .success { color: #00c853; text-align: center; font-size: 16px; margin-top: 16px; display: none; }
    iframe { display: none; }
  </style>
</head>
<body>
  <div class="header">💰 記帳表單</div>
  <div class="tab" id="tabBar">
    <button class="expense" onclick="setType('支出')">支出</button>
    <button class="income" onclick="setType('收入')">收入</button>
  </div>
  <div class="form">
    <div class="date-row">
      📅 <input type="date" id="dateInput">
    </div>
    <label>說明</label>
    <input type="text" id="itemInput" placeholder="請輸入項目名稱">
    <label>金額</label>
    <div class="amount-row">
      <span>$</span>
      <input type="number" id="amountInput" placeholder="0" min="0">
    </div>
    <label>備註（選填）</label>
    <input type="text" id="noteInput" placeholder="可不填">
    <button class="submit-btn" id="submitBtn" onclick="submitForm()">送出記帳</button>
    <div class="success" id="successMsg">✅ 記帳成功！視窗將自動關閉</div>
  </div>
  <iframe id="hiddenFrame" name="hiddenFrame"></iframe>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby4yN16K8Bfst5wcF_lrg4Mtyx76rX-ccvr1uh3gDXTbuU2G3tKAPCOnqZQpplzmVFUXw/exec';
    let currentType = '支出';
    let userName = '成員';
    let groupId = null;

    // 先從網址參數取得 groupId 和 userName
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('groupId')) groupId = urlParams.get('groupId');
    if (urlParams.get('userName')) userName = decodeURIComponent(urlParams.get('userName'));

    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;

    async function initLiff() {
      try {
        await liff.init({ liffId: '2010018644-6xUQ1NxD' });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        // 如果網址沒帶 userName，用 LIFF 取得的
        if (!urlParams.get('userName')) userName = profile.displayName;
        // 如果網址沒帶 groupId，嘗試從 context 取得
        if (!groupId) {
          const context = liff.getContext();
          if (context && context.groupId) groupId = context.groupId;
        }
      } catch(e) {
        console.log('LIFF init error:', e);
      }
    }

    function setType(type) {
      currentType = type;
      document.getElementById('tabBar').className = type === '收入' ? 'tab income-mode' : 'tab';
    }

    function submitForm() {
      const dateVal = document.getElementById('dateInput').value;
      const item = document.getElementById('itemInput').value.trim();
      const amount = document.getElementById('amountInput').value;
      const note = document.getElementById('noteInput').value.trim();

      if (!item || !amount || Number(amount) <= 0) {
        alert('請填寫說明和金額！');
        return;
      }

      const now = new Date();
      const timeStr = now.toTimeString().slice(0,8);
      const dateStr = dateVal + ' ' + timeStr;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送出中...';

      const form = document.createElement('form');
      form.method = 'GET';
      form.action = GAS_URL;
      form.target = 'hiddenFrame';

      const params = {
        action: 'group',
        groupId: groupId || 'unknown',
        userName: userName,
        type: currentType,
        date: dateStr,
        item: item,
        amount: amount,
        note: note
      };

      for (const [k, v] of Object.entries(params)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = v;
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(() => {
        document.getElementById('successMsg').style.display = 'block';
        btn.style.display = 'none';
        setTimeout(() => {
          try { if (liff.isInClient()) liff.closeWindow(); } catch(e) {}
        }, 1500);
      }, 1500);
    }

    initLiff();
  </script>
</body>
</html>
